version: 1
formatters:
  formatter:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: formatter
    stream: ext://sys.stdout
loggers:
  mts:
    level: DEBUG
    handlers: [console]
    propagate: no
  app:
    level: DEBUG
    handlers: [console]
    propagate: no
root:
  level: WARNING
  handlers: [console]