name: IMC2025
description: |
  Use mast3r par3r for pair creation
  Use minimum spanning tree to get the initial starting pairs
  Use Merged mast3r matcher

project_path: iterations
data_dirpath: "data/image-matching-challenge-2025"
sample_filepath: null
run_type: train
origin: None
git_commit: None
datasets_names: null
save_project_to_git: False
submission_dest_dirpath: null


pipeline_steps:
  paring:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.pair.sift.SiftDistanceParer
      dinov2_global_descriptor:
        _target_: mts.core.embedder.dinov2.DinoV2GlobalDescriptors.from_pretrained
        model_location: model-weights/fb-dinov2/snapshots/f9e44c814b77203eaa57a6bdbbd535f21ede1415

  kp_matching: 
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.match.mast3r.merged.Mast3rMatchPipelineStep.from_checkpoint
      grow_graph: 
        _target_: mts.core.scene_graph.transient.grow_densely
        _partial_: true
      mast3r_model_checkpoint: "model-weights/mast3r/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"

  reconstruction:
    _target_: mts.pipeline.step.reconstruct.colmap.incremental.ColmapReconstructionStep
    keypoints_name: mast3r
    matches_name: mast3r
    mapper_options:
      _target_: mts.helpers.colmap.options.create_incremental_pipeline_options
      min_model_size: 3
      max_num_models: 25

reconstruction_runner:
  create_pipeline_method: app.imc2025.pipeline.create_pipeline
  create_repository_method: app.imc2025.pipeline.create_h5_repository
  create_pipeline_state_method: app.imc2025.pipeline.create_pipeline_state