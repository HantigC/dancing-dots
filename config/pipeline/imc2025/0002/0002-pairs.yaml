name: IMC2025
description: |
  Create pairs using mast3r
project_path: iterations
is_train: True

pipeline_steps:
  paring:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.pair.mast3r.Mast3rParer.from_checkpoints
      model_checkpoint: "checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"
      retrieval_checkpoint: "checkpoints/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric_retrieval_trainingfree.pth"
      scene_graph: retrieval-20-40

reconstruction_runner:
  create_pipeline_method: app.imc2025.pipeline.create_pipeline
  create_repository_method: app.imc2025.pipeline.create_repository
  create_pipeline_state_method: app.imc2025.pipeline.create_pipeline_state