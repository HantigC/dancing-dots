name: IMC2025
description: |
  Same steps as 0023, but run against a single multi-scene image
  repository: every dataset is added to one repository up front as its
  own scene, then the whole repository is passed to a single pipeline
  run. The embedder (GlobalDescriptorStep) runs once over every image
  across all scenes (shared global-descriptor pass); pairing, MASt3R
  matching and COLMAP reconstruction are PerSceneStep and loop over
  repository.scenes() internally, one COLMAP db/output dir per scene at
  iterations/<iter>/<scene>/.
  Use DinoV2 global descriptors + kNN for pair creation.
  Match with MASt3R directly per pair (Mast3rDecodedMatchPipelineStep,
  falling back to that scene's repository pairs and encoding/decoding on
  demand since there is no separate encode/decode caching step).
  Encodings computed on the fly are kept in memory per scene and not
  persisted back to the repository (store_encodings: False, the default).
  Use ColmapReconstructionStep for incremental 3D reconstruction.

project_path: iterations
data_dirpath: "data/image-matching-challenge-2025"
sample_filepath: null
run_type: train
origin: None
git_commit: None
datasets_names: null
save_project_to_git: False
submission_dest_dirpath: null
tag: DinoV2(500)+DecodedMatch
mark: null
zip_project: False
zip_dest: None
delete_repo: False


pipeline_steps:
  embedder:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.extract.embedding.base.GlobalDescriptorStep
      max_size: 1024
      global_extractor:
        _target_: mts.core.embedder.dinov2.DinoV2GlobalDescriptors.from_pretrained
        model_location: model-weights/fb-dinov2/snapshots/f9e44c814b77203eaa57a6bdbbd535f21ede1415

  pairing:
    _target_: mts.pipeline.step.pair.knn.KnnEmbeddingParerStep
    k: 20
    min_distance_th: 0.0
    distance_th: 10
    max_pairs_per_image: 15
    max_pairs: 500

  kp_matching:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.match.mast3r.decoded.Mast3rDecodedMatchPipelineStep.from_checkpoint
      mast3r_model_checkpoint: "model-weights/mast3r/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth"
      grow_graph:
        _target_: mts.core.scene_graph.transient.grow_densely
        _partial_: true
      decodings_name: mast3r
      image_size: 512
      kernel_size: 5
      min_conf: 1.01

  reconstruction:
    _target_: mts.pipeline.step.reconstruct.colmap.incremental.ColmapReconstructionStep
    keypoints_name: mast3r
    matches_name: mast3r
    mapper_options:
      _target_: mts.helpers.colmap.options.create_incremental_pipeline_options
      min_model_size: 3
      max_num_models: 25


reconstruction_runner:
  create_pipeline_method: app.imc2025.pipeline.create_pipeline
  create_repository_method: app.imc2025.pipeline.create_h5_repository
  create_pipeline_state_method: app.imc2025.pipeline.create_pipeline_state
