name: IMC2025
description: |
  Same as 0028 (NetVLAD global descriptors + cross-distance pairing, MASt3R
  fine refinement) but with the single-GPU counterpart of the fast MASt3R
  matcher: Mast3rFastSingleMatchPipelineStep encodes each image once, keeps
  every encoding resident on one device, then decodes + dense-extracts the
  pairs sequentially in order (no replica list, no multi-GPU windowing), so
  it is a plain OnDeviceRunner-wrapped step like the rest of the pipeline.

project_path: iterations
data_dirpath: 'data/image-matching-challenge-2025'
sample_filepath: null
run_type: train
origin: None
git_commit: None
datasets_names: null
save_project_to_git: False
submission_dest_dirpath: null
tag: NetVlad+cross-dist+Mast3r+fast-singlegpu+fine-refine
mark: null
zip_project: False
zip_dest: None
delete_repo: False

pipeline_steps:
  embedder:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.extract.embedding.base.GlobalDescriptorStep
      max_size: 1024
      global_extractor:
        _target_: mts.core.embedder.vlad.NetVladEmbedding
        model_location: model-weights/net-vlad

  pairing:
    _target_: mts.pipeline.step.pair.cdist.CrossEmbeddingParerStep
    min_images: 20
    cutoff_th: 0.6
    distance_th: 10
    min_pairs: 20
    max_pairs_per_image: 15
    max_pairs: 1000

  kp_matching:
    _target_: mts.pipeline.step.base.OnDeviceRunner
    device: cuda:0
    step:
      _target_: mts.pipeline.step.match.mast3r.fast_single.Mast3rFastSingleMatchPipelineStep.from_checkpoint
      mast3r_model_checkpoint: 'model-weights/mast3r/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth'
      keypoints_name: mast3r
      matches_name: mast3r
      image_size: 512
      match_conf_th: 1.01
      min_pairs: 200
      subsample: 8
      pixel_tol: 0
      max_iter: 3
      validate: false

  reconstruction:
    _target_: mts.pipeline.step.reconstruct.colmap.incremental.ColmapReconstructionStep
    keypoints_name: mast3r
    matches_name: mast3r
    mapper_options:
      _target_: mts.helpers.colmap.options.create_incremental_pipeline_options
      min_model_size: 3
      max_num_models: 25

reconstruction_runner:
  create_pipeline_method: app.imc2025.pipeline.create_pipeline
  create_repository_method: app.imc2025.pipeline.create_h5_repository
  create_pipeline_state_method: app.imc2025.pipeline.create_pipeline_state
