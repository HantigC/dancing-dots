[project]
name = "disertation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "croco",
    "dust3r",
    "einops>=0.8.1",
    "h5py>=3.15.1",
    "hloc",
    "hydra-core>=1.3.2",
    "kornia>=0.8.2",
    "lightglue>=0.0",
    "mast3r",
    "matplotlib>=3.10.7",
    "more-itertools>=10.8.0",
    "nbformat>=5.10.4",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "plotly>=6.4.0",
    "py3nvml>=0.2.7",
    "pycolmap>=3.13.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]

[tool.uv.sources]
hloc = { git = "https://github.com/cvg/Hierarchical-Localization.git" }
croco = { path = "deps/wheels/croco-0.1.2-py3-none-any.whl" }
dust3r = { path = "deps/wheels/dust3r-0.1.0-py3-none-any.whl" }
mast3r = { path = "deps/wheels/mast3r-0.1.0-py3-none-any.whl" }
